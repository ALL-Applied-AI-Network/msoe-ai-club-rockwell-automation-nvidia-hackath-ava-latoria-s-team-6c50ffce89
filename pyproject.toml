[project]
name = "stacking-recovery"
version = "0.1.0"
description = "Vision-guided closed-loop manipulation for FANUC cube stacking"
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["opencv-python>=4.8"]
bench = ["pyyaml>=6.0"]
rl = ["numpy>=1.24"]
ml = [
  "opencv-python>=4.8",
  "pyyaml>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
