# Best table-camera pickup verifier from the fixed 2,520-pair benchmark.
model_path: models/grasp_pickup_table_resnet18_siamese_224.pt
backbone: resnet18
input_size: 224
table_pair_mode: siamese_rgb_pair
num_classes: 2
label_mode: pickup_binary

classes:
  - GOOD
  - SHIFTED

roi:
  y0: 0.0
  y1: 1.0
  x0: 0.0
  x1: 1.0

# Tuned on the validation split only. The held-out test result was 179/180.
thresholds:
  tau_good: 0.525
  tau_act: 0.50

training:
  architecture: resnet18
  pair_mode: siamese
  input_size: 224
  seed: 7
  epochs: 12
  warmup_epochs: 2
  batch_size: 32
  workers: 0
